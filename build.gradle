plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'de.undercouch.download' version '5.7.0'
}

group = 'com.github.milomarten'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven {
		url = uri("https://maven.pkg.github.com/milomarten/diceroll")
		credentials {
			username = project.findProperty("GITHUB_USERNAME") ?: System.getenv("GITHUB_USERNAME")
			password = project.findProperty("GITHUB_TOKEN") ?: System.getenv("GITHUB_TOKEN")
		}
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	implementation 'com.discord4j:discord4j-core:3.2.8'
	implementation 'org.apache.commons:commons-lang3:3.18.0'
	implementation 'org.apache.commons:commons-collections4:4.4'
	implementation 'org.apache.commons:commons-text:1.11.0'
	implementation 'org.apache.commons:commons-rng-simple:1.7'

	implementation 'com.opencsv:opencsv:5.12.0'

	implementation 'com.github.milomarten:diceroll:0.2.3'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('jar') {
    enabled = false
}

tasks.register('downloadPokemonData', Download) {
	src([
		"https://raw.githubusercontent.com/PokeAPI/pokeapi/refs/heads/master/data/v2/csv/pokemon_species.csv",
		"https://raw.githubusercontent.com/PokeAPI/pokeapi/refs/heads/master/data/v2/csv/pokemon_species_names.csv",
		"https://raw.githubusercontent.com/PokeAPI/pokeapi/refs/heads/master/data/v2/csv/pokemon_types.csv",
		"https://raw.githubusercontent.com/PokeAPI/pokeapi/refs/heads/master/data/v2/csv/type_names.csv",
		"https://raw.githubusercontent.com/PokeAPI/pokeapi/refs/heads/master/data/v2/csv/pokemon_abilities.csv",
		"https://raw.githubusercontent.com/PokeAPI/pokeapi/refs/heads/master/data/v2/csv/abilities.csv",
		"https://raw.githubusercontent.com/PokeAPI/pokeapi/refs/heads/master/data/v2/csv/ability_names.csv"
	])
	dest layout.projectDirectory.dir("/src/main/resources/pkmn")
}

bootJar {
    version = "local"
    if (project.hasProperty("tr2Version")) {
        version = project.property("tr2Version")
    }
    manifest {
        attributes 'Specification-Title': 'Taisha-Rangers 2'
        attributes 'Specification-Version': version
        attributes 'Specification-Vendor': 'Milo Marten'
        attributes 'Implementation-Title': 'com.github.milomarten.taisha_rangers2'
        attributes 'Implementation-Version': version
        attributes 'Implementation-Vendor': 'Milo Marten'
    }
}
